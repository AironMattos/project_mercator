[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercator"
version = "0.1.0"
description = "Project Mercator - plataforma de eventos territoriais para Curitiba"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.20",
    "psycopg2-binary>=2.9",
    "alembic>=1.19",
    "shapely>=2.1",
    "pyproj>=3.7",
    "requests>=2.34",
    "python-dotenv>=1.0",
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pandas>=2.0",
    "geopandas>=1.1",
    # Radar de Anúncios (checkpoint 12d) - parsing de HTML real (JSON-LD +
    # ficha técnica), conectores apolar_anuncios/chavesnamao_anuncios.
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    # apolar_anuncios especificamente (checkpoint 12d): a Apolar é uma SPA
    # em Vue totalmente renderizada no cliente - preço/quartos/vagas/
    # andar/condomínio só existem depois do JS rodar, `requests` sozinho
    # não vê esses campos (achado real, ver connector.py). Decisão
    # confirmada com o dono do projeto: Playwright só pra este conector,
    # Chaves na Mão continua HTTP puro (server-rendered).
    "playwright>=1.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["domain*", "commerce*", "pipelines*", "analytics*", "infrastructure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps/api"]
