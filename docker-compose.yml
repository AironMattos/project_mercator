services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mercator_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercator
      POSTGRES_PASSWORD: mercator
      POSTGRES_DB: mercator
    ports:
      - "5432:5432"
    volumes:
      - mercator_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercator -d mercator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mercator_pg_data:
